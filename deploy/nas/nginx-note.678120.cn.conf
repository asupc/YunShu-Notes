# 云树笔记（YunShu Notes）vhost
# 追加到 /vol2/1000/docker/nginx/conf/nginx.conf 的 http {} 内。
# Web 静态文件由 nginx 直接服务，/api/ 反代到本机 3001 的 Fastify 服务。
# 外网入口：https://note.678120.cn:8888（80/443 入站被运营商封禁）
server {
    # 域名访问，同时接受局域网 IP（无 DNS 时可直接用 IP）
    server_name note.678120.cn 192.168.1.71;
    listen 8888 ssl;
    # 局域网明文 HTTP 入口；80/443 被 fnOS 系统 nginx 占用，故使用 8080
    listen 192.168.1.71:8080;
    ssl_certificate /ssl/fullchain.pem;
    ssl_certificate_key /ssl/privkey.pem;

    root /usr/share/nginx/html/notes;
    index index.html;
    charset utf-8;

    client_max_body_size 500M;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ONLYOFFICE Docs 社区版：容器发布在宿主 8088，同源反代到 /onlyoffice/
    # 末尾斜杠会剥掉前缀，DS 内部仍按根路径处理；WebSocket 升级用于协同编辑。
    location = /onlyoffice {
        return 301 /onlyoffice/;
    }
    location ^~ /onlyoffice/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 保留端口，DS 生成的绝对地址才与外部入口一致
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /onlyoffice;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        client_max_body_size 500M;

        # 该 location 不再继承 server 级 X-Frame-Options SAMEORIGIN：
        # 桌面端 / 移动端 WebView 的页面源是 http://tauri.localhost，需要放开 iframe 嵌入。
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://tauri.localhost https://tauri.localhost tauri://localhost http://localhost https://localhost capacitor://localhost" always;
    }

    # REST API（同时承载 /api/v1/files/blob 签名上传/下载）
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # 使用 $http_host 保留端口，服务端据此生成与访问入口一致的签名 URL
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 桌面端 / 移动端 WebView 的页面源是 http://tauri.localhost，与 API 域名不同源。
        # server 级的 X-Frame-Options SAMEORIGIN 会拦截 /api/v1/files/blob 的 PDF 预览 iframe，
        # 表现为“note.678120.cn 拒绝连接”。location 内声明 add_header 后不再继承 server 级设置，
        # 故显式补齐安全头，并用 CSP frame-ancestors 放开客户端 WebView 源。
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://tauri.localhost https://tauri.localhost tauri://localhost http://localhost https://localhost capacitor://localhost" always;
    }

    # 前端构建产物带 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 入口不缓存，发布后刷新即生效
    location ~* \.html$ {
        expires -1;
    }
}
