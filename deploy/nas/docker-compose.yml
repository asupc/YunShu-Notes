services:
  yunshu-server:
    # 镜像由 scripts/deploy-fnos.sh 在本机构建后 load 上飞牛，image tag 每次部署自动回填。
    # 不要再加 build: —— 本文件是「镜像部署」的权威配置，避免误用远端陈旧源码重建。
    image: "yunshu-server:local"
    container_name: yunshu-server
    restart: unless-stopped
    environment:
      PORT: 3001
      WS_PORT: 3002
      # 签名上传/下载 URL 使用公网地址；外网入口固定带 :8888
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://note.678120.cn:8888}
      DATA_DIR: /data
      SQLITE_PATH: /data/yunshu.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # 注册入口默认关闭；需要新增账号时临时改为 true 并重启容器
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-yunshu-onlyoffice-secret-change-me}
      ONLYOFFICE_INTERNAL_API_BASE: ${ONLYOFFICE_INTERNAL_API_BASE:-http://yunshu-server:3001}
      # 保存回调里的 /cache/files 从 ONLYOFFICE 容器内网取，避免公网 NAT 回环
      ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL:-http://yunshu-onlyoffice}
      TZ: Asia/Shanghai
    ports:
      # 只监听回环，由宿主 nginx（host 网络）反代
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    volumes:
      - ./data:/data
    networks:
      - docker_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ONLYOFFICE Docs 社区版：Web 端经 nginx 同源反代到 /onlyoffice/，
  # 服务端容器通过 docker_network 访问 yunshu-server:3001 完成取文件与保存回调。
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: yunshu-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      # 必须与服务端 ONLYOFFICE_JWT_SECRET 完全一致（两者都取 .env 同一变量）
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is required}
      JWT_HEADER: Authorization
      # 允许访问内网 yunshu-server:3001 拉取/回调；文件地址用云树自己的签名，无需 DS JWT
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      USE_UNAUTHORIZED_STORAGE: "true"
      TZ: Asia/Shanghai
    ports:
      # 仅用于本机 nginx 反代与局域网排障；外网统一走 https://note.678120.cn:8888/onlyoffice/
      - "8088:80"
    volumes:
      - ./onlyoffice/data:/var/www/onlyoffice/Data
      - ./onlyoffice/logs:/var/log/onlyoffice
    networks:
      - docker_network

networks:
  docker_network:
    external: true
