services:
  yunshu-server:
    # 镜像由 scripts/deploy-fnos.sh 在本机构建后 load 上飞牛，image tag 每次部署自动回填。
    # 不要再加 build: —— 本文件是「镜像部署」的权威配置，避免误用远端陈旧源码重建。
    image: "yunshu-server:local"
    container_name: yunshu-server
    restart: unless-stopped
    environment:
      PORT: 3001
      WS_PORT: 3002
      # 签名上传/下载 URL 使用公网地址；外网入口固定带 :8888
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://note.678120.cn:8888}
      DATA_DIR: /data
      SQLITE_PATH: /data/yunshu.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # 注册入口默认关闭；需要新增账号时临时改为 true 并重启容器
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      TZ: Asia/Shanghai
    ports:
      # 只监听回环，由宿主 nginx（host 网络）反代
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    volumes:
      - ./data:/data
    networks:
      - docker_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  docker_network:
    external: true
