services:
  yunshu-server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    container_name: yunshu-server
    restart: unless-stopped
    environment:
      PORT: 3001
      WS_PORT: 3002
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:3001}
      DATA_DIR: /data
      SQLITE_PATH: /data/yunshu.db
      JWT_SECRET: ${JWT_SECRET:-please-change-jwt-secret-in-production}
    ports:
      - "3001:3001"
      - "3002:3002"
    volumes:
      - ./data:/data
